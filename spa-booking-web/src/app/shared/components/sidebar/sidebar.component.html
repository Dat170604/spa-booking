<aside
  [ngClass]="{ 'w-64': !isCollapsed, 'w-20': isCollapsed }"
  class="bg-slate-900 text-slate-300 min-h-screen flex flex-col justify-between transition-all duration-300 shadow-xl border-r border-slate-800">

  <div>
    <!-- Header của Sidebar -->
    <div class="h-16 flex items-center justify-between px-4 border-b border-slate-800">
      <div *ngIf="!isCollapsed" class="flex items-center gap-2 font-bold text-lg text-emerald-400">
        <span>✨ Admin Portal</span>
      </div>
      <div *ngIf="isCollapsed" class="mx-auto font-bold text-emerald-400 text-xl">
        ✨
      </div>

      <!-- Nút Thu gọn / Mở rộng Sidebar -->
      <button (click)="toggleSidebar()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                [attr.d]="isCollapsed ? 'M13 5l7 7-7 7M5 5l7 7-7 7' : 'M11 19l-7-7 7-7m8 14l-7-7 7-7'"/>
        </svg>
      </button>
    </div>

    <!-- Navigation List -->
    <nav class="p-3 space-y-1">
      <ng-container *ngFor="let item of menuItems">
        <a *ngIf="hasPermission(item.roles)"
           [routerLink]="item.route"
           routerLinkActive="bg-emerald-600 text-white font-semibold shadow-lg shadow-emerald-900/40"
           class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition group cursor-pointer">

          <!-- Icon -->
          <svg class="w-6 h-6 flex-shrink-0 transition group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"/>
          </svg>

          <!-- Title (Ẩn khi thu gọn) -->
          <span *ngIf="!isCollapsed" class="text-sm truncate">
            {{ item.label }}
          </span>
        </a>
      </ng-container>
    </nav>
  </div>

  <!-- Bottom Action: Về trang chủ -->
  <div class="p-3 border-t border-slate-800">
    <a routerLink="/" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-emerald-400 transition">
      <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      <span *ngIf="!isCollapsed" class="text-sm font-medium">Trang Khách Hàng</span>
    </a>
  </div>
</aside>
