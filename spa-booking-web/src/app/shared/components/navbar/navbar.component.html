<nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">

      <!-- Logo & Navigation Links -->
      <div class="flex items-center">
        <a routerLink="/" class="flex-shrink-0 flex items-center gap-2">
          <span class="text-2xl font-bold text-emerald-600">✨ Lotus Spa</span>
        </a>

        <div class="hidden md:ml-8 md:flex md:space-x-6">
          <a routerLink="/branches" routerLinkActive="text-emerald-600 font-semibold"
             class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-emerald-600 transition">
            Chi nhánh
          </a>
          <a routerLink="/services" routerLinkActive="text-emerald-600 font-semibold"
             class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-emerald-600 transition">
            Dịch vụ Spa
          </a>
          <a routerLink="/booking" routerLinkActive="text-emerald-600 font-semibold"
             class="inline-flex items-center px-1 pt-1 text-sm font-medium text-gray-700 hover:text-emerald-600 transition">
            Đặt lịch ngay
          </a>
        </div>
      </div>

      <!-- Right Action Area (Đăng nhập / Đăng ký hoặc User Profile) -->
      <div class="hidden md:flex md:items-center md:space-x-4">

        <!-- Nút Đăng nhập & Đăng ký khi CHƯA đăng nhập -->
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/login"
             class="text-sm font-medium text-gray-700 hover:text-emerald-600 px-3 py-2 transition">
            Đăng nhập
          </a>
          <a routerLink="/register"
             class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm">
            Đăng ký
          </a>
        </ng-container>

        <!-- Khi ĐÃ ĐĂNG NHẬP -->
        <ng-container *ngIf="isLoggedIn">
          <a *ngIf="isAdmin || isStaff" routerLink="/admin/dashboard"
             class="bg-amber-100 text-amber-800 hover:bg-amber-200 text-xs font-semibold px-3 py-1.5 rounded-full transition">
            ⚙️ Trang quản trị
          </a>

          <div class="relative ml-3">
            <button (click)="toggleDropdown()" class="flex items-center gap-2 text-sm focus:outline-none">
              <div class="w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold border border-emerald-300">
                {{ currentUser?.fullName?.charAt(0) || 'U' }}
              </div>
              <span class="font-medium text-gray-700">{{ currentUser?.fullName }}</span>
            </button>

            <!-- Dropdown menu -->
            <div *ngIf="isDropdownOpen" class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 z-50">
              <a routerLink="/my-bookings" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Lịch hẹn của tôi</a>
              <button (click)="logout()" class="w-full text-left block px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-medium border-t border-gray-100">
                Đăng xuất
              </button>
            </div>
          </div>
        </ng-container>

      </div>

      <!-- Mobile Button -->
      <div class="flex items-center md:hidden">
        <button (click)="toggleMobileMenu()" class="text-gray-600 hover:text-gray-900 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden border-t border-gray-200 bg-white px-4 py-3 space-y-2">
    <a routerLink="/branches" class="block text-gray-700 py-1">Chi nhánh</a>
    <a routerLink="/services" class="block text-gray-700 py-1">Dịch vụ Spa</a>
    <a routerLink="/booking" class="block text-emerald-600 font-semibold py-1">Đặt lịch ngay</a>

    <div *ngIf="!isLoggedIn" class="pt-2 border-t border-gray-200 flex flex-col gap-2">
      <a routerLink="/auth/login" class="w-full text-center py-2 border border-emerald-600 text-emerald-600 font-medium rounded-lg">Đăng nhập</a>
      <a routerLink="/auth/register" class="w-full text-center py-2 bg-emerald-600 text-white font-medium rounded-lg">Đăng ký</a>
    </div>

    <div *ngIf="isLoggedIn" class="pt-2 border-t border-gray-200 space-y-2">
      <p class="font-bold text-gray-800">{{ currentUser?.fullName }}</p>
      <a *ngIf="isAdmin || isStaff" routerLink="/admin/dashboard" class="block text-amber-600 font-medium">Trang quản trị</a>
      <button (click)="logout()" class="block text-red-600 font-medium">Đăng xuất</button>
    </div>
  </div>
</nav>
