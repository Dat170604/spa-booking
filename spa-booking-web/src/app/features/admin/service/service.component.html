<div class="p-6 space-y-6 bg-slate-900 text-slate-100 min-h-screen">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">⚡ Quản Lý Dịch Vụ Spa</h1>
      <p class="text-slate-400 text-sm">Quản lý bảng giá và thông tin gói liệu trình</p>
    </div>
    <button (click)="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm transition">
      + Thêm Dịch Vụ Mới
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let s of services" class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl flex flex-col justify-between">
      <div class="space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-lg text-white">{{ s.name }}</h3>
          <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-full">⏱ {{ s.durationMinutes }} phút</span>
        </div>
        <p class="text-xs text-slate-400 line-clamp-3">{{ s.description || 'Chưa có mô tả' }}</p>
        <p class="text-lg font-extrabold text-amber-400">{{ s.price | currency:'VND':'symbol':'1.0-0' }}</p>
      </div>

      <div class="pt-4 border-t border-slate-700/50 flex gap-2 mt-4">
        <button (click)="openModal(s)" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs font-semibold">Chỉnh sửa</button>
        <button (click)="deleteService(s.id)" class="px-3 py-2 bg-red-600/30 hover:bg-red-600 text-red-300 hover:text-white rounded-xl text-xs">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Modal Form -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg p-6 rounded-2xl space-y-4">
      <h3 class="text-xl font-bold">{{ isEdit ? 'Sửa Dịch Vụ' : 'Thêm Dịch Vụ' }}</h3>
      <form [formGroup]="serviceForm" (ngSubmit)="saveService()" class="space-y-3">
        <input formControlName="name" placeholder="Tên dịch vụ" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-emerald-500" />
        <textarea formControlName="description" placeholder="Mô tả dịch vụ" rows="3" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-emerald-500"></textarea>

        <div class="grid grid-cols-2 gap-3">
          <input type="number" formControlName="price" placeholder="Giá (VND)" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none" />
          <input type="number" formControlName="durationMinutes" placeholder="Thời lượng (Phút)" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none" />
        </div>

        <div class="flex justify-end gap-3 pt-4">
          <button type="button" (click)="closeModal()" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-sm">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-sm">Lưu</button>
        </div>
      </form>
    </div>
  </div>
</div>
