<div class="login-container">
  <div class="login-card">
    <h2>Đăng Nhập Spa Booking</h2>
    <p class="subtitle">Vui lòng nhập tài khoản để tiếp tục đặt lịch</p>

    <!-- Thông báo lỗi tổng quát từ Backend -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="example@gmail.com"
          [ngClass]="{ 'is-invalid': f['email'].touched && f['email'].errors }"
        />
        <div *ngIf="f['email'].touched && f['email'].errors" class="invalid-feedback">
          <small *ngIf="f['email'].errors['required']">Email không được để trống</small>
          <small *ngIf="f['email'].errors['email']">Email không đúng định dạng</small>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [ngClass]="{ 'is-invalid': f['password'].touched && f['password'].errors }"
        />
        <div *ngIf="f['password'].touched && f['password'].errors" class="invalid-feedback">
          <small *ngIf="f['password'].errors['required']">Mật khẩu không được để trống</small>
          <small *ngIf="f['password'].errors['minlength']">Mật khẩu phải có ít nhất 6 ký tự</small>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Đăng Nhập</span>
        <span *ngIf="isLoading">Đang xử lý...</span>
      </button>
    </form>

    <div class="login-footer">
      <p>Chưa có tài khoản? <a routerLink="/register">Đăng ký ngay</a></p>
    </div>
  </div>
</div>
