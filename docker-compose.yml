services:
  postgres:
    image: postgres:16-alpine
    container_name: lotus-spa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spa-network

  redis:
    image: redis:7-alpine
    container_name: lotus-spa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spa-network

  backend:
    image: ${DOCKERHUB_USERNAME}/lotus-spa-backend:latest
    build:
      context: ./spa-booking-service
      dockerfile: Dockerfile
    container_name: lotus-spa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Ghi đè host kết nối sang tên container trong mạng Docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: ${TZ}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spa-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/lotus-spa-frontend:latest
    build:
      context: ./spa-booking-web
      dockerfile: Dockerfile
    container_name: lotus-spa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - spa-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  spa-network:
    driver: bridge