services:
  postgres:
    image: postgres:16-alpine
    container_name: lotus-spa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-spa_booking_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dat170604}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-spa_booking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spa-network

  redis:
    image: redis:7-alpine
    container_name: lotus-spa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spa-network

  backend:
    image: ${DOCKERHUB_USERNAME:-dat170604}/lotus-spa-backend:latest
    container_name: lotus-spa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      SERVER_PORT: ${SERVER_PORT:-8080}

      # Database & Redis trong mạng nội bộ Docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-spa_booking_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-dat170604}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Tài khoản Admin khởi tạo mặc định
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@spa.com}
      ADMIN_PHONE: ${ADMIN_PHONE:-0999999999}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@123}

      # JWT Security
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      REFRESH_TOKEN_EXPIRATION_MS: ${REFRESH_TOKEN_EXPIRATION_MS:-604800000}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}

      # Email & Cloudinary (Tùy chọn - có thể cấu hình thêm trong file .env)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - spa-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-dat170604}/lotus-spa-frontend:latest
    container_name: lotus-spa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    networks:
      - spa-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  spa-network:
    driver: bridge