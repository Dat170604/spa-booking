server:
    port: ${SERVER_PORT:8080}

spring:
    application:
        name: spa-booking-service

    config:
        import: optional:file:../.env[.properties],optional:file:.env[.properties]

    web:
        error:
            include-message: always
            include-binding-errors: always

    mail:
        host: ${MAIL_HOST:smtp.gmail.com}
        port: ${MAIL_PORT:587}
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/spa_booking_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:dat170604}
        driver-class-name: org.postgresql.Driver

    flyway:
        enabled: true
        baseline-on-migrate: true
        baseline-version: 0
        locations: classpath:db/migration

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                jdbc:
                    lob:
                        non_contextual_creation: true

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            timeout: 2000ms

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB





cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}





management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: when-authorized

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html





app:
    admin:
        full-name: ${ADMIN_FULL_NAME:Administrator}
        email: ${ADMIN_EMAIL:admin@spa.com}
        phone: ${ADMIN_PHONE:0999999999}
        password: ${ADMIN_PASSWORD:admin@123}

    jwt:
        secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
        expiration-ms: ${JWT_EXPIRATION_MS:900000}
        refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

    cors:
        allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}