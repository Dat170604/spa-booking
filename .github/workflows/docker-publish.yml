name: Build & Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main # Tự động chạy mỗi khi push hoặc merge vào nhánh main
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lotus-spa-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lotus-spa-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./spa-booking-service
          file: ./spa-booking-service/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./spa-booking-web
          file: ./spa-booking-web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend